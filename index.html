<!DOCTYPE html>
<!-- manifest＝つうしんが なくても あそべるように、端末へ しまう ファイルの一覧（tools/build_app.py が作る） -->
<html lang="ja" manifest="offline.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="くるくる">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<title>くるくる ずけい</title>
<!-- format-ok 年長の子が触るアプリ画面（デザインが主目的の成果物＝表示整形の規程は適用外。文字は全てひらがな） -->
<style>
  /* いろ＝赤と緑を「意味の区別」に使わない。せいかい＝青＋✓／ちがう＝橙＋！
     暗い画面＝この端末（iOS 10）には設定が無いが、新しい端末で開いたときのために 紙と文字だけ切り替える。
     カードの中身（かたち・いきもの）の色は 明るい画面と同じ＝見分けの目じるしのため変えない */
  :root{
    color-scheme: light dark;
    --ground:#f6f4ee; --card:#ffffff; --ink:#1b1b1b; --ink-soft:#55606b; --line:#d6d8dc;
    --ao:#0072B2; --daidai:#E69F00; --murasaki:#CC79A7; --mizu:#56B4E9; --ki:#F0E442; --ryokuao:#009E73;
    --ao-bg:#eaf3fa; --daidai-bg:#fdf3e2; --daidai-ink:#8a5a00; --nashi:#9aa5ae; --on-accent:#ffffff;
    --on-mizu:#102030; --on-murasaki:#2a1020; --locked:#f1f1ef;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#14191f; --card:#1c232b; --ink:#e8edf2; --ink-soft:#a7b4c0; --line:#38434e;
      --ao-bg:#12354a; --daidai-bg:#3d3010; --daidai-ink:#f2b544; --nashi:#5b6672; --locked:#232830;
      --ao:#0072B2; --daidai:#E69F00; --murasaki:#CC79A7; --mizu:#56B4E9; --ki:#F0E442; --ryokuao:#009E73;
      --on-accent:#ffffff; --on-mizu:#102030; --on-murasaki:#2a1020;
    }
  }
  *{box-sizing:border-box;}
  html{font-size:24px;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:0.92rem; line-height:1.6;
    -webkit-text-size-adjust:100%; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
  }
  .screen{padding:10px 14px 30px; max-width:900px; margin:0 auto;}
  h1{font-size:1.25rem; margin:4px 0 2px;}
  h2{font-size:1rem; margin:8px 0;}
  p{margin:6px 0;}
  button{
    font-family:inherit; font-size:0.92rem; -webkit-appearance:none; appearance:none;
    border:0; border-radius:12px; padding:12px 20px; color:var(--on-accent); background:var(--ao);
    cursor:pointer; min-height:58px;
  }
  button.sub{background:var(--nashi);}
  button.small{font-size:0.67rem; min-height:0; padding:8px 14px;}
  .head{overflow:hidden; padding-bottom:4px;}
  .head h1{float:left;}
  .head .right{float:right; margin-top:6px;}
  .note{color:var(--ink-soft); font-size:0.67rem;}

  /* はじめの がめん */
  .egg-row{overflow:hidden; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:12px; margin:10px 0;}
  .egg-row canvas{float:left; width:120px; height:120px; margin-right:14px;}
  .egg-row .egg-text{overflow:hidden;}
  .egg-row .egg-text p{margin:2px 0;}
  .lv-list button{display:block; width:100%; margin:12px 0 0; padding:18px; font-size:1.08rem; text-align:left; min-height:0;}
  .lv-list button span{display:block; font-size:0.63rem; opacity:0.92;}
  #lv-1{background:var(--mizu); color:var(--on-mizu);}
  #lv-2{background:var(--ao);}
  #lv-3{background:var(--murasaki); color:var(--on-murasaki);}
  .home-foot{overflow:hidden; margin-top:14px;}
  .home-foot button{float:left; margin-right:10px;}
  .home-foot #grown-btn{float:right;}

  /* あそぶ */
  .qbar{overflow:hidden; font-size:0.75rem; color:var(--ink-soft);}
  .qbar #play-back{float:left; margin-right:10px;}
  .qbar span{display:inline-block; margin:10px 10px 0 0;}
  .qbox{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:12px; margin:8px 0; text-align:center;}
  .qtext{font-size:1.08rem; font-weight:bold; margin:4px 0 8px;}
  .qrow{display:-webkit-flex; display:flex; -webkit-justify-content:center; justify-content:center; -webkit-align-items:center; align-items:center;}
  .qrow canvas{width:210px; height:210px;}
  #q-arrow{color:var(--ao); margin-left:10px; min-width:60px;}
  #q-arrow svg{display:block; margin:2px 0;}
  #q-after-wrap{margin-left:14px;}
  .qlabel{font-size:0.67rem; color:var(--ink-soft);}
  .choices{display:-webkit-flex; display:flex; -webkit-flex-wrap:wrap; flex-wrap:wrap; -webkit-justify-content:center; justify-content:center; margin-top:6px;}
  .choice{width:46%; max-width:210px; margin:1.5%; background:var(--card); border:4px solid var(--line); border-radius:16px; padding:8px; text-align:center; cursor:pointer;}
  .choice canvas{width:100%; height:auto; display:block;}
  .choice .cv{width:150px; height:150px; margin:0 auto;}
  .choice .mark{font-size:0.83rem; min-height:1.4em; font-weight:bold;}
  .choice.right{border-color:var(--ao); background:var(--ao-bg);}
  .choice.right .mark{color:var(--ao);}
  .choice.wrong{border-color:var(--daidai); background:var(--daidai-bg);}
  .choice.wrong .mark{color:var(--daidai-ink);}
  .choice-count .cnum{font-size:1.33rem; font-weight:bold; padding:14px 0 4px;}
  .choice-count .carw{color:var(--ao); min-height:40px;}
  .msg{text-align:center; font-size:0.92rem; min-height:1.6em; margin:8px 0;}
  .msg.good{color:var(--ao); font-weight:bold;}
  .msg.warn{color:var(--daidai-ink); font-weight:bold;}
  .playfoot{text-align:center;}
  .playfoot button{margin:4px 8px;}
  #next-btn{font-size:1.08rem; padding:14px 40px;}

  /* けっか */
  .res{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:16px; text-align:center;}
  .res canvas{width:150px; height:150px;}
  .stars{font-size:1.42rem; letter-spacing:4px; color:var(--daidai);}
  .res button{margin:8px 6px;}

  /* ずかん */
  .zlist{overflow:hidden;}
  .zcard{float:left; width:30%; margin:1.5%; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:8px; text-align:center; font-size:0.75rem;}
  .zcard canvas{width:100%; height:auto;}
  .zcard.none{color:var(--nashi); background:var(--locked);}
  .zcard.none canvas{opacity:0.25;}

  /* おとなのひと */
  .grown{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:14px; font-size:0.75rem;}
  .grown table{border-collapse:collapse; width:100%; margin:8px 0;}
  .grown th,.grown td{border:1px solid var(--line); padding:6px 10px; text-align:left;}
  .grown input,.grown select{font-size:0.83rem; padding:8px; border:1px solid var(--line); border-radius:8px; width:100%; color:var(--ink); background:var(--card);}
  .grown label{display:block; margin-top:10px;}
  #reset-2{background:var(--murasaki); color:var(--on-murasaki);}

  @media (max-width:600px){
    .qrow canvas{width:160px; height:160px;}
    .choice .cv{width:120px; height:120px;}
    .zcard{width:47%;}
  }
</style>
</head>
<body>

<!-- ===== はじめの がめん ===== -->
<div id="scr-home" class="screen">
  <div class="head">
    <h1>くるくる ずけい</h1>
  </div>
  <p class="note">かたちを まわすと どう見える？ あてると はっぱが もらえて、いきものが そだつよ。</p>
  <div class="egg-row">
    <canvas id="home-egg" width="120" height="120"></canvas>
    <div class="egg-text">
      <p id="home-rank"></p>
      <p id="home-leaves" class="note"></p>
      <p id="home-stage"></p>
      <p id="home-creature" class="note"></p>
    </div>
  </div>
  <div class="lv-list">
    <button id="lv-1">やさしい <span>みぎに 1かい。3まいから えらぶ</span><span id="lv-sug-1"></span></button>
    <button id="lv-2">ふつう <span>みぎ・ひだり・2かい。4まいから えらぶ</span><span id="lv-sug-2"></span></button>
    <button id="lv-3">むずかしい <span>3かいまで。「なんかい まわした？」も でる</span><span id="lv-sug-3"></span></button>
  </div>
  <div class="home-foot">
    <button id="zukan-btn" class="sub"><span id="home-zukan-count">ずかん</span></button>
    <button id="grown-btn" class="sub small">おとなのひと（ながおし）</button>
  </div>
</div>

<!-- ===== あそぶ ===== -->
<div id="scr-play" class="screen" style="display:none">
  <div class="qbar">
    <button id="play-back" class="sub small">やめる</button>
    <span id="play-level"></span><span id="play-no"></span>
  </div>
  <div class="qbox">
    <div id="q-text" class="qtext"></div>
    <div class="qrow">
      <canvas id="q-before" width="210" height="210"></canvas>
      <div id="q-arrow"></div>
      <div id="q-after-wrap" style="display:none"><div class="qlabel">まわした あと</div><canvas id="q-after" width="210" height="210"></canvas></div>
    </div>
    <div id="q-mark-note" class="note"></div>
  </div>
  <div id="choices" class="choices"></div>
  <div id="msg" class="msg"></div>
  <div class="playfoot">
    <button id="hint-btn" class="sub">ヒント</button>
    <button id="next-btn" style="display:none">つぎへ</button>
  </div>
</div>

<!-- ===== けっか ===== -->
<div id="scr-result" class="screen" style="display:none">
  <div class="res">
    <h2 id="res-title"></h2>
    <div id="res-stars" class="stars"></div>
    <p id="res-score"></p>
    <p id="res-leaves"></p>
    <canvas id="res-egg" width="150" height="150"></canvas>
    <p id="res-events"></p>
    <div>
      <button id="res-again">もういちど</button>
      <button id="res-up" style="display:none"></button>
      <button id="res-home" class="sub">はじめに もどる</button>
    </div>
  </div>
</div>

<!-- ===== ずかん ===== -->
<div id="scr-zukan" class="screen" style="display:none">
  <div class="head"><h1>ずかん</h1><button id="zukan-back" class="sub small right">もどる</button></div>
  <p class="note">はっぱを 24まい あつめると、1ぴき うまれるよ。</p>
  <div id="zukan-list" class="zlist"></div>
</div>

<!-- ===== おとなのひと ===== -->
<div id="scr-grown" class="screen" style="display:none">
  <div class="head"><h1>おとなのひと</h1><button id="grown-back" class="sub small right">もどる</button></div>
  <div class="grown">
    <label>なまえ（ひらがな・8もじまで）<input id="grown-name" type="text" maxlength="8"></label>
    <label>1まわりの もんだいの かず
      <select id="grown-per"><option value="5">5もん</option><option value="10">10もん</option></select>
    </label>
    <p><button id="grown-save" class="small">ほぞんして もどる</button></p>
    <table id="grown-table"></table>
    <h3>目安</h3>
    <p>やさしいで 5問中4問が続いたら ふつうへ。</p>
    <h3>問題の形</h3>
    <ul>
      <li>過去問型＝2×2の絵を回したとき、しるしの絵の向きを4つから選ぶ</li>
      <li>基本型＝かたちを回した形を選ぶ（鏡の形もまざる）</li>
      <li>回数型＝元の形と回した形を見て、何回回したか</li>
    </ul>
    <p><button id="reset-1" class="sub small">きろくを ぜんぶ けす</button> <button id="reset-2" class="small" style="display:none">ほんとうに けす</button></p>
    <p id="grown-ver" class="note"></p>
  </div>
</div>

<script>
/* くるくる ずけい ―― まわした かたちを あてる あそび（2012年の iPad・iOS 10.3.3 で動く書き方）
   きまり＝
   ・古い Safari で動く書き方だけ（var と function。let/const/アロー/テンプレート文字列は使わない）
   ・絵文字は使わない（この端末の字の在庫は 2016年で止まっている）
   ・赤と緑を「意味の区別」に使わない（色は Okabe-Ito の 青・橙・紫・水色・黄・緑青 から）
   ・端末内保存（localStorage）は try-catch で包み、やり直しの手段を画面に置く
   このファイルは tools/build_app.py が index.html へ埋め込む。直すのは src/ だけ。 */
(function (global) {
  'use strict';

  var KZ = {};
  /* このファイルを直したら この数字を +1 する。version.txt にも同じ数字を書く（build_app.py が照合する） */
  KZ.APP_VERSION = 1;
  KZ.SCHEMA = 1;          /* 端末内保存の形。変えると古い記録は捨てて作り直す */
  KZ.STORE_KEY = 'kurukuru_zukei_v1';

  /* ================= いろ（Okabe-Ito） ================= */
  var COL = {
    ao: '#0072B2', daidai: '#E69F00', murasaki: '#CC79A7', mizu: '#56B4E9',
    ki: '#F0E442', ryokuao: '#009E73', sumi: '#1b1b1b', shiro: '#ffffff',
    usui: '#8a949c', kami: '#fffdf7'
  };
  KZ.COL = COL;

  /* ================= らんすう（試験では たねを 固定できる） ================= */
  var rngState = null;
  function rnd() {
    if (rngState === null) { return Math.random(); }
    /* mulberry32 */
    rngState = (rngState + 0x6D2B79F5) | 0;
    var t = rngState;
    t = Math.imul ? Math.imul(t ^ (t >>> 15), t | 1) : (((t ^ (t >>> 15)) * (t | 1)) | 0);
    t ^= t + (Math.imul ? Math.imul(t ^ (t >>> 7), t | 61) : (((t ^ (t >>> 7)) * (t | 61)) | 0));
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  KZ.seed = function (s) { rngState = (s === null || s === undefined) ? null : (s | 0); };
  function ri(n) { return Math.floor(rnd() * n); }
  function pick(arr) { return arr[ri(arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = ri(i + 1); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  KZ.shuffle = shuffle;

  /* ================= しるし（ますの中の 図形） =================
     period＝回して元に戻るまでの数。mirror＝左右をひっくり返したときの向きの対応。
     左右にひっくり返して 別の種類の しるしに なるものは 入れない（鏡の答えが作れなくなるため）。 */
  var MARKS = {
    maru:    { period: 1, mirror: [0] },
    kuro:    { period: 1, mirror: [0] },
    shikaku: { period: 1, mirror: [0] },
    batsu:   { period: 1, mirror: [0] },
    sankaku: { period: 4, mirror: [0, 3, 2, 1] },   /* 0=うえ 1=みぎ 2=した 3=ひだり */
    hanbun:  { period: 4, mirror: [1, 0, 3, 2] },   /* 0=ひだりうえ が ぬってある 1=みぎうえ 2=みぎした 3=ひだりした */
    sen:     { period: 2, mirror: [0, 1] }          /* 0=よこ 1=たて */
  };
  KZ.MARKS = MARKS;
  var MARK_NAMES = ['maru', 'kuro', 'shikaku', 'batsu', 'sankaku', 'hanbun', 'sen'];
  var ORIENTED = ['sankaku', 'hanbun', 'sen'];

  /* ================= かたち（grid か pic） ================= */
  /* grid＝{kind:'grid', n:2|3, cells:[{r,c,m,o}]}  pic＝{kind:'pic', id:'sakana'} */

  function transformGrid(fig, mirror, rot) {
    var n = fig.n, out = [], i, cell, r, c, o, m, k;
    for (i = 0; i < fig.cells.length; i++) {
      cell = fig.cells[i]; r = cell.r; c = cell.c; o = cell.o; m = cell.m;
      if (mirror) { c = n - 1 - c; o = MARKS[m].mirror[o]; }
      for (k = 0; k < rot; k++) {
        /* みぎに 90度＝(r,c) → (c, n-1-r)。しるしの向きも ひとつ すすむ */
        var nr = c, nc = n - 1 - r;
        r = nr; c = nc;
        o = (o + 1) % MARKS[m].period;
      }
      out.push({ r: r, c: c, m: m, o: o });
    }
    return { kind: 'grid', n: n, cells: out };
  }
  KZ.transformGrid = transformGrid;

  function gridSig(fig) {
    var parts = [], i, cell;
    for (i = 0; i < fig.cells.length; i++) {
      cell = fig.cells[i];
      parts.push(cell.r + ',' + cell.c + ',' + cell.m + ',' + cell.o);
    }
    parts.sort();
    return 'g' + fig.n + ':' + parts.join(';');
  }

  /* view＝{base, mirror:0|1, rot:0..3}＝画面に出す 1枚 */
  function viewSig(view) {
    if (view.base.kind === 'grid') {
      return gridSig(transformGrid(view.base, view.mirror, view.rot));
    }
    return 'p:' + view.base.id + ':' + view.mirror + ':' + view.rot;
  }
  KZ.viewSig = viewSig;

  /* 回しても ひっくり返しても 全部ちがう かたちか（8とおりが 全部ちがう） */
  function allDistinct(base) {
    var seen = {}, m, k, s;
    for (m = 0; m < 2; m++) {
      for (k = 0; k < 4; k++) {
        s = viewSig({ base: base, mirror: m, rot: k });
        if (seen[s]) { return false; }
        seen[s] = true;
      }
    }
    return true;
  }
  KZ.allDistinct = allDistinct;

  /* ますの かたちを 1つ作る（8とおりが 全部ちがうものだけ 返す） */
  function makeGrid(n, count, needOriented) {
    var tries, fig, spots, i, cells, m, o, picked;
    for (tries = 0; tries < 200; tries++) {
      spots = [];
      for (i = 0; i < n * n; i++) { spots.push(i); }
      spots = shuffle(spots).slice(0, count);
      cells = [];
      picked = false;
      for (i = 0; i < spots.length; i++) {
        if (needOriented && i === 0) { m = pick(ORIENTED); } else { m = pick(MARK_NAMES); }
        if (ORIENTED.indexOf(m) >= 0) { picked = true; }
        o = ri(MARKS[m].period);
        cells.push({ r: Math.floor(spots[i] / n), c: spots[i] % n, m: m, o: o });
      }
      fig = { kind: 'grid', n: n, cells: cells };
      if (needOriented && !picked) { continue; }
      if (allDistinct(fig)) { return fig; }
    }
    /* ここへは まず来ない（3ますに 2つ以上の しるしで ほぼ必ず 見つかる）。
       来たら 確実に ちがう かたち を 返す */
    return { kind: 'grid', n: 2, cells: [{ r: 0, c: 0, m: 'sankaku', o: 1 }, { r: 1, c: 1, m: 'kuro', o: 0 }] };
  }
  KZ.makeGrid = makeGrid;

  /* ================= いきもの（絵） ================= */
  /* 絵は 100×100 の ますの まん中を (0,0) として 描く。左右・上下が ちがって見えるように 作る。
     （回しても ひっくり返しても 見分けが つくかは tools/test.html が 画素で 確かめる） */
  function circle(ctx, x, y, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  }
  function ellipse(ctx, x, y, rx, ry, fill, stroke, lw) {
    ctx.save(); ctx.translate(x, y); ctx.scale(rx, ry);
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.restore();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  }
  function poly(ctx, pts, fill, stroke, lw) {
    var i;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) { ctx.lineTo(pts[i][0], pts[i][1]); }
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  }
  function line(ctx, x1, y1, x2, y2, color, lw) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
  }

  var PICS = [
    { id: 'sakana', name: 'さかな', draw: function (ctx) {
      poly(ctx, [[-26, 0], [-42, -15], [-42, 15]], COL.ao, COL.sumi, 2);             /* お */
      poly(ctx, [[-10, -13], [0, -28], [8, -13]], COL.mizu, COL.sumi, 2);           /* せびれ（上だけ） */

  function pickMirror(mirrors, rot) {
    var i;
    for (i = 0; i < mirrors.length; i++) { if (mirrors[i].rot === rot) { return mirrors[i]; } }
    return pick(mirrors);
  }

  /* ================= もんだい文 ================= */
  function questionText(q) {
    var t = q.times + 'かい';
    if (q.type === 'count') { return 'なんかい まわしたかな？'; }
    if (q.type === 'toka') { return 'やじるしの ほうに ' + t + ' まわすと、●の えは どれ？'; }
    if (q.wording === 'yajirushi') { return 'やじるしの ほうに ' + t + ' まわすと どれ？'; }
    return (q.dir === 'migi' ? 'みぎに ' : 'ひだりに ') + t + ' まわすと どれ？';
  }
  KZ.questionText = questionText;

  /* まわる やじるしの 絵（SVG の文字列・絵文字は使わない） */
  function arrowSvg(dir, size) {
    var s = size || 44;
    var flip = dir === 'hidari' ? ' transform="scale(-1,1) translate(-48,0)"' : '';
    return '<svg class="arw" width="' + s + '" height="' + s + '" viewBox="0 0 48 48" aria-hidden="true">' +
      '<g' + flip + '>' +
      '<path d="M 10 28 A 15 15 0 1 1 24 39" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>' +
      '<path d="M 30 44 L 22 36 L 32 32 Z" fill="currentColor"/>' +
      '</g></svg>';
  }
  KZ.arrowSvg = arrowSvg;

  /* ================= きろく（端末内保存） ================= */
  function freshState() {
    return {
      schema: KZ.SCHEMA, name: '', perRound: 5, lastLevel: 1,
      total: 0, cIndex: 0, cLeaves: 0, zukan: [], lap: 0,
      lv: { 1: { rounds: 0, q: 0, ok: 0 }, 2: { rounds: 0, q: 0, ok: 0 }, 3: { rounds: 0, q: 0, ok: 0 } }
    };
  }
  KZ.freshState = freshState;

  function loadState() {
    var raw = null, s;
    try { raw = global.localStorage ? global.localStorage.getItem(KZ.STORE_KEY) : null; } catch (e) { raw = null; }
    if (!raw) { return freshState(); }
    try { s = JSON.parse(raw); } catch (e2) { return freshState(); }
    if (!s || s.schema !== KZ.SCHEMA) { return freshState(); }
    return s;
  }
  function saveState(s) {
    try { if (global.localStorage) { global.localStorage.setItem(KZ.STORE_KEY, JSON.stringify(s)); } } catch (e) { /* 保存できなくても あそべる */ }
  }
  KZ.loadState = loadState; KZ.saveState = saveState;

  /* はっぱ（せいかいで もらえる）→ いきものの せいちょう
     0〜5＝たまご 6〜13＝ようちゅう 14〜23＝さなぎ 24＝せいちゅう（ずかんへ） */
  var GROW = [0, 6, 14, 24];
  KZ.GROW = GROW;
  function stageOf(leaves) {
    if (leaves >= GROW[3]) { return 3; }
    if (leaves >= GROW[2]) { return 2; }
    if (leaves >= GROW[1]) { return 1; }
    return 0;
  }
  KZ.stageOf = stageOf;
  var STAGE_NAME = ['たまご', 'ようちゅう', 'さなぎ', 'せいちゅう'];
  KZ.STAGE_NAME = STAGE_NAME;

  /* はっぱを たして、おきたことを 返す（純粋な計算＝試験できる） */
  function addLeaves(s, n) {
    var events = [], before = stageOf(s.cLeaves), after, id;
    s.total += n;
    s.cLeaves += n;
    while (s.cLeaves >= GROW[3]) {
      id = PICS[s.cIndex % PICS.length].id;
      s.zukan.push(id);
      events.push({ kind: 'adult', id: id });
      s.cLeaves -= GROW[3];
      s.cIndex += 1;
      if (s.cIndex % PICS.length === 0) { s.lap += 1; events.push({ kind: 'lap', lap: s.lap }); }
      before = 0;
    }
    after = stageOf(s.cLeaves);
    if (after > before) { events.push({ kind: 'stage', stage: after }); }
    return events;
  }
  KZ.addLeaves = addLeaves;

  var RANKS = [[0, 'くるくる みならい'], [20, 'くるくる なかま'], [50, 'くるくる めいじん'], [100, 'くるくる はかせ'], [200, 'くるくる たつじん']];
  function rankOf(total) {
    var i, name = RANKS[0][1];
    for (i = 0; i < RANKS.length; i++) { if (total >= RANKS[i][0]) { name = RANKS[i][1]; } }
    return name;
  }
  KZ.rankOf = rankOf;
  function nextRankAt(total) {
    var i;
    for (i = 0; i < RANKS.length; i++) { if (total < RANKS[i][0]) { return RANKS[i][0]; } }
    return null;
  }
  KZ.nextRankAt = nextRankAt;

  /* ================= いきものの せいちょうの 絵 ================= */
  function drawStage(ctx, size, stage, picId) {
    var s = size / 100;
    ctx.save(); ctx.scale(s, s); ctx.lineJoin = 'round';
    if (stage === 0) {
      ellipse(ctx, 0, 2, 24, 30, COL.kami, COL.sumi, 2.5);
      circle(ctx, -8, -6, 4, COL.ki); circle(ctx, 9, 4, 5, COL.ki); circle(ctx, -4, 16, 3.5, COL.ki);
    } else if (stage === 1) {
      circle(ctx, -24, 8, 9, COL.ki, COL.sumi, 2); circle(ctx, -10, 6, 10, COL.ki, COL.sumi, 2);
      circle(ctx, 5, 4, 10, COL.ki, COL.sumi, 2); circle(ctx, 22, 2, 12, COL.ki, COL.sumi, 2);
      circle(ctx, 26, -2, 2.2, COL.sumi);
    } else if (stage === 2) {
      ctx.beginPath(); ctx.moveTo(0, -34); ctx.quadraticCurveTo(26, -6, 16, 24); ctx.quadraticCurveTo(0, 40, -16, 24);
      ctx.quadraticCurveTo(-26, -6, 0, -34); ctx.closePath();
      ctx.fillStyle = COL.daidai; ctx.fill(); ctx.strokeStyle = COL.sumi; ctx.lineWidth = 2.5; ctx.stroke();
      line(ctx, -10, -4, 10, -4, COL.sumi, 2); line(ctx, -12, 8, 12, 8, COL.sumi, 2); line(ctx, -8, 20, 8, 20, COL.sumi, 2);
      line(ctx, 0, -34, 0, -44, COL.sumi, 3);
    } else {
      ctx.lineJoin = 'round';
      PIC_BY_ID[picId].draw(ctx);
    }
    ctx.restore();
  }
  KZ.drawStage = drawStage;

  function paintStage(canvas, stage, picId) {
    var css = canvas.clientWidth || 120, dpr = global.devicePixelRatio || 1, ctx;
    if (canvas.width !== Math.round(css * dpr)) { canvas.width = Math.round(css * dpr); canvas.height = Math.round(css * dpr); }
    ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.scale(dpr, dpr); ctx.translate(css / 2, css / 2);
    drawStage(ctx, css * 0.9, stage, picId);
  }
  KZ.paintStage = paintStage;

  /* ================= 自己点検（tools/test.html から 呼ぶ） ================= */
  KZ.selfTest = function (doc) {
    var out = [], pass = 0, fail = 0;
    function ok(cond, label) { if (cond) { pass++; } else { fail++; out.push('FAIL ' + label); } }
    var i, j, k, m, q, sigs, cnt, lvl, base, fig, v, a, b, s, canvas, ctx, data, variants, diff, total, px, py, events;

    KZ.seed(12345);
    /* T1 変換の きまり */
    base = { kind: 'grid', n: 3, cells: [{ r: 0, c: 0, m: 'sankaku', o: 0 }, { r: 1, c: 2, m: 'hanbun', o: 1 }, { r: 2, c: 1, m: 'sen', o: 0 }] };
    ok(gridSig(transformGrid(base, 0, 4)) === gridSig(base), 'T1 4回まわすと もどる');
    ok(gridSig(transformGrid(transformGrid(base, 1, 0), 1, 0)) === gridSig(base), 'T1 2回ひっくり返すと もどる');
    fig = transformGrid(base, 0, 1);
    ok(fig.cells[0].r === 0 && fig.cells[0].c === 2 && fig.cells[0].o === 1, 'T1 (0,0)うえ△ → (0,2)みぎ△');
    ok(fig.cells[2].r === 1 && fig.cells[2].c === 0 && fig.cells[2].o === 1, 'T1 (2,1)よこ線 → (1,0)たて線');
    for (i = 0; i < MARK_NAMES.length; i++) {
      m = MARK_NAMES[i];
      for (j = 0; j < MARKS[m].period; j++) { ok(MARKS[m].mirror[MARKS[m].mirror[j]] === j, 'T1 ' + m + ' の鏡は 2回で もどる o=' + j); }
    }
    /* 鏡のあと回転＝逆回転のあと鏡 の関係（ますの中身で確認） */
    a = gridSig(transformGrid(transformGrid(base, 0, 1), 1, 0));
    b = gridSig(transformGrid(transformGrid(base, 1, 0), 0, 3));
    ok(a === b, 'T1 鏡と回転の 入れかえ');

    /* T2 もんだい 各レベル 600問 */
    for (lvl = 1; lvl <= 3; lvl++) {
      cnt = { turn: 0, count: 0, toka: 0 };
      for (i = 0; i < 600; i++) {
        q = makeQuestion(lvl);
        cnt[q.type]++;
        if (q.type === 'toka') {
          ok(q.choices.length === 4, 'T2 toka 4まい lv' + lvl);
          sigs = {}; total = 0;
          for (j = 0; j < q.choices.length; j++) { s = viewSig(q.choices[j]); if (sigs[s]) { total++; } sigs[s] = true; ok(q.choices[j].base.id === q.base.cells[q.base.mark], 'T2 toka えらぶ絵＝●の絵'); }
          ok(total === 0, 'T2 toka 同じ向きなし');
          ok(q.answerIndex >= 0 && q.choices[q.answerIndex].rot === rotOf(q.dir, q.times), 'T2 toka 正解の向き lv' + lvl);
          ok(ASKABLE.indexOf(q.base.cells[q.base.mark]) >= 0, 'T2 toka きく絵は ASKABLE');
          sigs = {}; total = 0;
          for (j = 0; j < 4; j++) { if (sigs[q.base.cells[j]]) { total++; } sigs[q.base.cells[j]] = true; }
          ok(total === 0, 'T2 toka 4つの絵は 全部ちがう');
          if (lvl === 1) { ok(q.dir === 'migi' && q.times === 1, 'T2 toka やさしい は みぎ1かい'); }
          continue;
        }
        if (q.type === 'count') {
          ok(q.choices[q.answerIndex] === q.times, 'T2 count の答え lv' + lvl);
          ok(q.times >= 1 && q.times <= 3, 'T2 count の回数 lv' + lvl);
          ok(lvl === 3, 'T2 count は むずかしい だけ');
          continue;
        }
        ok(q.choices.length === LEVELS[lvl].choices, 'T2 えらぶ枚数 lv' + lvl + ' =' + q.choices.length);
        sigs = {}; total = 0;
        for (j = 0; j < q.choices.length; j++) { s = viewSig(q.choices[j]); if (sigs[s]) { total++; } sigs[s] = true; }
        ok(total === 0, 'T2 えらぶ枚数に 同じ形なし lv' + lvl);
        ok(q.answerIndex >= 0 && viewSig(q.choices[q.answerIndex]) === viewSig(q.correct), 'T2 正解が入っている lv' + lvl);
        ok(viewSig(q.correct) === viewSig({ base: q.base, mirror: 0, rot: rotOf(q.dir, q.times) }), 'T2 正解＝指示どおりの回転 lv' + lvl);
        ok(q.correct.mirror === 0, 'T2 正解は鏡でない lv' + lvl);
        if (lvl === 1) { ok(q.dir === 'migi' && q.times === 1 && q.wording === 'dir', 'T2 やさしい は みぎ1かい・ことばで'); }
        if (lvl === 2) { ok(q.times <= 2, 'T2 ふつう は 2かいまで'); }
        if (q.base.kind === 'grid') {
          ok(allDistinct(q.base), 'T2 ますの形は 8とおり全部ちがう lv' + lvl);
          ok(q.base.n === (lvl === 1 ? 2 : 3), 'T2 ますの数 lv' + lvl);
        }
        /* 鏡の かたちが かならず 1枚 */
        total = 0;
        for (j = 0; j < q.choices.length; j++) { if (q.choices[j].mirror === 1) { total++; } }
        ok(total === 1, 'T2 鏡の形が1枚 lv' + lvl + ' =' + total);
      }
      if (lvl === 3) { ok(cnt.count > 60 && cnt.count < 190, 'T2 count の割合 ' + cnt.count + '/600'); }
      else { ok(cnt.count === 0, 'T2 count なし lv' + lvl); }
      ok(cnt.toka > 150 && cnt.toka < 400, 'T2 toka の割合 lv' + lvl + ' ' + cnt.toka + '/600');
      ok(cnt.turn > 150, 'T2 turn の割合 lv' + lvl + ' ' + cnt.turn + '/600');
    }

    /* T3 いきものの絵＝8とおりが 画素で 見分けられる（64px四方で 1.5%＝61画素以上ちがう。
       過去問の「点の位置だけが ちがう」形も通し、対称な形（差0）は止める） */
    if (doc && doc.createElement) {
      canvas = doc.createElement('canvas'); canvas.width = 64; canvas.height = 64;
      ctx = canvas.getContext('2d');
      for (i = 0; i < PICS.length; i++) {
        variants = [];
        for (m = 0; m < 2; m++) {
          for (k = 0; k < 4; k++) {
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 64, 64);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 64, 64);
            ctx.translate(32, 32);
            drawView(ctx, 60, { base: { kind: 'pic', id: PICS[i].id }, mirror: m, rot: k }, 0);
            variants.push(ctx.getImageData(0, 0, 64, 64).data);
          }
        }
        for (a = 0; a < variants.length; a++) {
          for (b = a + 1; b < variants.length; b++) {
            diff = 0;
            for (px = 0; px < variants[a].length; px += 4) {
              if (Math.abs(variants[a][px] - variants[b][px]) + Math.abs(variants[a][px + 1] - variants[b][px + 1]) + Math.abs(variants[a][px + 2] - variants[b][px + 2]) > 60) { diff++; }
            }
            ok(diff > 64 * 64 * 0.015, 'T3 ' + PICS[i].id + ' 変種' + a + 'と' + b + ' の差=' + diff);
          }
        }
      }
        /* T3b 過去問の かたち＝きく側は 4回の回転が 画素で 見分けられる・まわり用も 描ける */
        for (i = 0; i < SHAPES.length; i++) {
          variants = [];
          for (k = 0; k < 4; k++) {
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 64, 64);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 64, 64);
            ctx.translate(32, 32);
            drawView(ctx, 60, { base: { kind: 'pic', id: SHAPES[i].id }, mirror: 0, rot: k }, 0);
            variants.push(ctx.getImageData(0, 0, 64, 64).data);
          }
          if (!SHAPES[i].asked) { ok(true, 'T3b filler'); continue; }
          for (a = 0; a < 4; a++) {
            for (b = a + 1; b < 4; b++) {
              diff = 0;
              for (px = 0; px < variants[a].length; px += 4) {
                if (Math.abs(variants[a][px] - variants[b][px]) + Math.abs(variants[a][px + 1] - variants[b][px + 1]) + Math.abs(variants[a][px + 2] - variants[b][px + 2]) > 60) { diff++; }
              }
              ok(diff > 64 * 64 * 0.015, 'T3b ' + SHAPES[i].id + ' 向き' + a + 'と' + b + ' の差=' + diff);
            }
          }
        }
        /* T3c カードが 描ける（4つの向き） */
        for (k = 0; k < 4; k++) {
          try { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(32, 32); drawView(ctx, 60, { base: makeCard(), mirror: 0, rot: k }, 0); ok(true, 'T3c'); } catch (e3) { ok(false, 'T3c card ' + e3); }
        }
        /* T4 しるし 全部 描ける */
        for (i = 0; i < MARK_NAMES.length; i++) {
          for (j = 0; j < MARKS[MARK_NAMES[i]].period; j++) {
            try { ctx.save(); drawMark(ctx, MARK_NAMES[i], j, 20); ctx.restore(); ok(true, 'T4'); } catch (e) { ok(false, 'T4 ' + MARK_NAMES[i] + ' ' + e); }
          }
        }
        for (i = 0; i < 4; i++) { try { drawStage(ctx, 60, i, PICS[0].id); ok(true, 'T4 stage'); } catch (e2) { ok(false, 'T4 stage ' + i + ' ' + e2); } }
      }

    /* T5 はっぱと せいちょう */
    s = freshState();
    events = addLeaves(s, 5); ok(events.length === 0 && stageOf(s.cLeaves) === 0, 'T5 5まいは たまごのまま');
    events = addLeaves(s, 1); ok(events.length === 1 && events[0].kind === 'stage' && events[0].stage === 1, 'T5 6まいで ようちゅう');
    events = addLeaves(s, 18); ok(s.zukan.length === 1 && s.zukan[0] === PICS[0].id && s.cLeaves === 0 && s.cIndex === 1, 'T5 24まいで ずかんへ');
    ok(events[0].kind === 'adult', 'T5 adult イベント');
    events = addLeaves(s, 24 * 5 + 3); ok(s.zukan.length === 6 && s.lap === 1 && s.cLeaves === 3 && s.cIndex === 6, 'T5 6ひきで 1しゅう');
    ok(rankOf(0) === 'くるくる みならい' && rankOf(20) === 'くるくる なかま' && rankOf(250) === 'くるくる たつじん', 'T5 かんむり');
    ok(nextRankAt(0) === 20 && nextRankAt(200) === null, 'T5 つぎの かんむり');
    ok(questionText({ type: 'turn', dir: 'hidari', times: 2, wording: 'dir' }) === 'ひだりに 2かい まわすと どれ？', 'T5 もんだい文');
    ok(arrowSvg('hidari').indexOf('scale(-1,1)') > 0 && arrowSvg('migi').indexOf('scale(-1,1)') < 0, 'T5 やじるしの向き');

    KZ.seed(null);
    out.unshift('PASS=' + pass + ' FAIL=' + fail);
    return out;
  };

  global.KZ = KZ;
})(typeof window !== 'undefined' ? window : this);
</script>
<script>
/* くるくる ずけい ―― 画面（ui.js・古い Safari で動く書き方だけ） */
(function (global) {
  'use strict';
  var KZ = global.KZ, doc = global.document;
  var S = KZ.loadState();          /* きろく */
  var G = null;                    /* いま あそんでいる 1まわり */
  var screen = 'home';
  var animTimer = null;

  function el(id) { return doc.getElementById(id); }
  function setText(node, text) { if (node) { node.textContent = text; } }
  function show(id) {
    var ids = ['scr-home', 'scr-play', 'scr-result', 'scr-zukan', 'scr-grown'], i;
    for (i = 0; i < ids.length; i++) { el(ids[i]).style.display = (ids[i] === 'scr-' + id) ? 'block' : 'none'; }
    screen = id;
    if (id === 'home') { checkUpdate(); reloadIfIdle(); }
    global.scrollTo(0, 0);
  }
  function on(id, fn) { var n = el(id); if (n) { n.addEventListener('click', fn, false); } }

  /* ================= はじめの がめん ================= */
  function renderHome() {
    var who = S.name ? S.name + ' の' : '', stage = KZ.stageOf(S.cLeaves), pic = KZ.PICS[S.cIndex % KZ.PICS.length];
    var next = KZ.nextRankAt(S.total), need = KZ.GROW[3] - S.cLeaves;
    setText(el('home-rank'), who + ' かんむり：' + KZ.rankOf(S.total));
    setText(el('home-leaves'), 'はっぱ ' + S.total + 'まい' + (next !== null ? '（つぎの かんむりまで あと ' + (next - S.total) + 'まい）' : '（いちばん うえ！）'));
    setText(el('home-stage'), KZ.STAGE_NAME[stage] + (stage === 3 ? '' : '（せいちゅうまで あと ' + need + 'まい）'));
    setText(el('home-creature'), stage >= 2 ? pic.name + ' に なるかな？' : 'なにに なるかな？');
    KZ.paintStage(el('home-egg'), stage, pic.id);
    setText(el('home-zukan-count'), 'ずかん ' + S.zukan.length + 'ひき');
    setText(el('lv-sug-1'), S.lv[1].rounds ? S.lv[1].ok + '／' + S.lv[1].q + ' せいかい' : '');
    setText(el('lv-sug-2'), S.lv[2].rounds ? S.lv[2].ok + '／' + S.lv[2].q + ' せいかい' : '');
    setText(el('lv-sug-3'), S.lv[3].rounds ? S.lv[3].ok + '／' + S.lv[3].q + ' せいかい' : '');
  }

  /* ================= あそぶ ================= */
  function startRound(level) {
    var i, qs = [];
    for (i = 0; i < S.perRound; i++) { qs.push(KZ.makeQuestion(level)); }
    G = { level: level, qs: qs, idx: 0, ok: 0, firstOk: 0, leaves: 0, tries: 0, done: false, events: [] };
    S.lastLevel = level; KZ.saveState(S);
    show('play');
    renderQuestion();
  }

  function renderQuestion() {
    var q = G.qs[G.idx], box = el('choices'), i, c, wrap, lab, isCount = q.type === 'count';
    G.tries = 0; G.done = false;
    stopAnim();
    setText(el('play-level'), KZ.LEVELS[G.level].name);
    setText(el('play-no'), (G.idx + 1) + ' ／ ' + G.qs.length + ' もんめ');
    setText(el('q-text'), KZ.questionText(q));
    el('q-arrow').innerHTML = isCount ? '' : repeatArrow(q.dir, q.times);
    el('q-arrow').style.display = isCount ? 'none' : 'block';
    /* もとの かたち */
    el('q-before').style.display = 'block';
    KZ.paintCanvas(el('q-before'), q.type === 'count' ? q.before : { base: q.base, mirror: 0, rot: 0 }, 0);
    el('q-after-wrap').style.display = isCount ? 'block' : 'none';
    if (isCount) { KZ.paintCanvas(el('q-after'), q.after, 0); }
    setText(el('q-mark-note'), q.type === 'toka' ? '●が ついている えを よく見てね' : '');
    /* えらぶ */
    box.innerHTML = '';
    for (i = 0; i < q.choices.length; i++) {
      wrap = doc.createElement('div'); wrap.className = 'choice'; wrap.setAttribute('data-i', String(i));
      if (isCount) {
        wrap.className += ' choice-count';
        wrap.innerHTML = '<div class="cnum">' + q.choices[i] + 'かい</div><div class="carw">' + repeatArrow('migi', q.choices[i], 30) + '</div>';
      } else {
        c = doc.createElement('canvas'); c.className = 'cv';
        wrap.appendChild(c);
      }
      lab = doc.createElement('div'); lab.className = 'mark'; lab.textContent = '';
      wrap.appendChild(lab);
      box.appendChild(wrap);
    }
    if (!isCount) { paintChoices(); }
    setText(el('msg'), 'どれかな？ タップしてね');
    el('msg').className = 'msg';
    el('next-btn').style.display = 'none';
    el('hint-btn').style.display = (q.type === 'count') ? 'none' : 'inline-block';
  }

  function paintChoices() {
    var q = G.qs[G.idx], nodes = el('choices').getElementsByTagName('canvas'), i;
    for (i = 0; i < nodes.length; i++) { KZ.paintCanvas(nodes[i], q.choices[i], 0); }
  }

  function repeatArrow(dir, times, size) {
    var s = '', i;
    for (i = 0; i < times; i++) { s += KZ.arrowSvg(dir, size || 44); }
    return s;
  }

  function choiceNodes() { return el('choices').getElementsByClassName('choice'); }

  function onChoice(i) {
    var q = G.qs[G.idx], nodes = choiceNodes(), node = nodes[i], leaves = 0;
    if (G.done) { return; }
    if (i === q.answerIndex) {
      G.done = true;
      node.className += ' right';
      setText(node.getElementsByClassName('mark')[0], '✓ せいかい');
      leaves = (G.tries === 0) ? 2 : 1;
      G.ok++; if (G.tries === 0) { G.firstOk++; }
      G.leaves += leaves;
      setText(el('msg'), (G.tries === 0 ? 'せいかい！ はっぱ 2まい' : 'せいかい！ はっぱ 1まい'));
      el('msg').className = 'msg good';
      playTurnAnim(q, function () { el('next-btn').style.display = 'inline-block'; });
    } else {
      G.tries++;
      node.className += ' wrong';
      setText(node.getElementsByClassName('mark')[0], '！ ちがう');
      if (G.tries === 1) {
        setText(el('msg'), 'おしい！ もういちど えらんでみよう');
        el('msg').className = 'msg warn';
      } else {
        G.done = true;
        nodes[q.answerIndex].className += ' right';
        setText(nodes[q.answerIndex].getElementsByClassName('mark')[0], '✓ こたえ');
        setText(el('msg'), 'こたえは これ。まわる ようすを 見てね');
        el('msg').className = 'msg warn';
        playTurnAnim(q, function () { el('next-btn').style.display = 'inline-block'; });
      }
    }
    el('hint-btn').style.display = 'none';
  }

  /* もとの かたちを 実際に まわして 見せる（紙を まわす 練習の かわり） */
  function playTurnAnim(q, done) {
    var canvas = el('q-before'), view, sign, total, start = null, dur;
    if (q.type === 'count') { view = q.before; sign = 1; total = q.times; }
    else { view = { base: q.base, mirror: 0, rot: 0 }; sign = (q.dir === 'migi') ? 1 : -1; total = q.times; }
    dur = 700 * total;
    stopAnim();
    function step(ts) {
      var t, ang;
      if (start === null) { start = ts; }
      t = Math.min(1, (ts - start) / dur);
      ang = sign * total * (Math.PI / 2) * easeInOut(t);
      KZ.paintCanvas(canvas, view, ang);
      if (t < 1) { animTimer = requestFrame(step); }
      else { animTimer = null; if (done) { done(); } }
    }
    animTimer = requestFrame(step);
  }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }
  function requestFrame(fn) {
    if (global.requestAnimationFrame) { return global.requestAnimationFrame(fn); }
    return global.setTimeout(function () { fn((new Date()).getTime()); }, 16);
  }
  function stopAnim() {
    if (animTimer === null) { return; }
    if (global.cancelAnimationFrame) { global.cancelAnimationFrame(animTimer); }
    global.clearTimeout(animTimer);
    animTimer = null;
  }

  /* ヒント＝もとの かたちを ゆっくり まわして、すぐ もどす（答えは 見せきらない） */
  function onHint() {
    var q = G.qs[G.idx], canvas = el('q-before'), view, sign, start = null, dur = 1400;
    if (G.done || q.type === 'count') { return; }
    view = { base: q.base, mirror: 0, rot: 0 }; sign = (q.dir === 'migi') ? 1 : -1;
    stopAnim();
    function step(ts) {
      var t, ang;
      if (start === null) { start = ts; }
      t = Math.min(1, (ts - start) / dur);
      /* 半分までは まわして、のこりで もどす。いちばん まわった ときで 60度 */
      ang = sign * (Math.PI / 3) * Math.sin(Math.PI * t);
      KZ.paintCanvas(canvas, view, ang);
      if (t < 1) { animTimer = requestFrame(step); } else { animTimer = null; KZ.paintCanvas(canvas, view, 0); }
    }
    animTimer = requestFrame(step);
    setText(el('msg'), 'こっちに まわるよ。●や しるしが どこへ いくか 見てね');
    el('msg').className = 'msg';
  }

  function onNext() {
    G.idx++;
    if (G.idx >= G.qs.length) { finishRound(); return; }
    renderQuestion();
  }

  function finishRound() {
    var stat = S.lv[G.level], events, i, lines = [], stars = '', adultId = null;
    stat.rounds++; stat.q += G.qs.length; stat.ok += G.ok;
    events = KZ.addLeaves(S, G.leaves);
    KZ.saveState(S);
    for (i = 0; i < G.qs.length; i++) { stars += (i < G.firstOk) ? '★' : (i < G.ok ? '☆' : '・'); }
    setText(el('res-title'), G.ok === G.qs.length ? 'ぜんぶ せいかい！' : 'おつかれさま！');
    setText(el('res-score'), G.qs.length + 'もんちゅう ' + G.ok + 'もん せいかい');
    setText(el('res-stars'), stars);
    setText(el('res-leaves'), 'はっぱ ＋' + G.leaves + 'まい（ぜんぶで ' + S.total + 'まい）');
    for (i = 0; i < events.length; i++) {
      if (events[i].kind === 'stage') { lines.push(KZ.STAGE_NAME[events[i].stage] + ' に なった！'); }
      if (events[i].kind === 'adult') { adultId = events[i].id; lines.push(KZ.picById(events[i].id).name + ' が うまれた！ ずかんに はいったよ'); }
      if (events[i].kind === 'lap') { lines.push('ぜんぶの いきものが そろった！ ' + events[i].lap + 'しゅうめ'); }
    }
    if (lines.length === 0) { lines.push(KZ.STAGE_NAME[KZ.stageOf(S.cLeaves)] + ' が そだっているよ（せいちゅうまで あと ' + (KZ.GROW[3] - S.cLeaves) + 'まい）'); }
    setText(el('res-events'), lines.join(' ／ '));
    if (adultId) { KZ.paintStage(el('res-egg'), 3, adultId); }
    else { KZ.paintStage(el('res-egg'), KZ.stageOf(S.cLeaves), KZ.PICS[S.cIndex % KZ.PICS.length].id); }
    /* つぎの レベルの おすすめ（4／5 以上 で ひとつ 上を すすめる） */
    if (G.level < 3 && G.firstOk >= Math.ceil(G.qs.length * 0.8)) {
      el('res-up').style.display = 'inline-block';
      setText(el('res-up'), 'つぎは「' + KZ.LEVELS[G.level + 1].name + '」に チャレンジ');
    } else { el('res-up').style.display = 'none'; }
    show('result');
  }

  /* ================= ずかん ================= */
  function renderZukan() {
    var box = el('zukan-list'), i, pic, card, c, got, cv;
    box.innerHTML = '';
    for (i = 0; i < KZ.PICS.length; i++) {
      pic = KZ.PICS[i];
      got = 0; for (c = 0; c < S.zukan.length; c++) { if (S.zukan[c] === pic.id) { got++; } }
      card = doc.createElement('div'); card.className = 'zcard' + (got ? '' : ' none');
      cv = doc.createElement('canvas'); cv.className = 'zcv'; card.appendChild(cv);
      card.appendChild(doc.createElement('div')).textContent = got ? pic.name + (got > 1 ? ' ×' + got : '') : '？？？';
      box.appendChild(card);
      if (got) { KZ.paintStage(cv, 3, pic.id); } else { KZ.paintStage(cv, 0, pic.id); }
    }
  }

  /* ================= おとなのひと ================= */
  function renderGrown() {
    var t = el('grown-table'), i, rows = '';
    el('grown-name').value = S.name || '';
    el('grown-per').value = String(S.perRound);
    for (i = 1; i <= 3; i++) {
      rows += '<tr><td>' + KZ.LEVELS[i].name + '</td><td>' + S.lv[i].rounds + '</td><td>' + S.lv[i].q + '</td><td>' + S.lv[i].ok + '</td></tr>';
    }
    t.innerHTML = '<tr><th>レベル</th><th>まわり</th><th>もんだい</th><th>せいかい</th></tr>' + rows;
    setText(el('grown-ver'), 'はんすう ' + KZ.APP_VERSION + '・はっぱ ' + S.total + '・ずかん ' + S.zukan.length);
    el('reset-2').style.display = 'none';
  }
  var holdTimer = null;
  function holdStart() { holdTimer = global.setTimeout(function () { holdTimer = null; renderGrown(); show('grown'); }, 1200); }
  function holdEnd() { if (holdTimer) { global.clearTimeout(holdTimer); holdTimer = null; } }

  /* ================= 版の 取りなおし（おかえりクエスト・オセロと同型） ================= */
  var UPD_KEY = 'kurukuru_upd';
  function tidyUrl() {
    if (!global.history || !global.history.replaceState) { return; }
    if (global.location.search.indexOf('v=') < 0) { return; }
    try { global.history.replaceState(null, '', global.location.pathname); } catch (e) { /* 見ためだけ */ }
  }
  function checkUpdate() {
    var x;
    if (!global.XMLHttpRequest) { return; }
    try { x = new global.XMLHttpRequest(); } catch (e) { return; }
    try { x.open('GET', 'version.txt?t=' + (new Date()).getTime(), true); } catch (e2) { return; }
    x.onreadystatechange = function () {
      var v, now, last = null, part;
      if (x.readyState !== 4 || x.status !== 200) { return; }
      v = parseInt(String(x.responseText).replace(/[^0-9]/g, ''), 10);
      now = (new Date()).getTime();
      if (!(v > KZ.APP_VERSION)) { return; }
      try { last = global.sessionStorage.getItem(UPD_KEY); } catch (e3) { /* 無くても進む */ }
      if (last) { part = String(last).split(':'); if (part[0] === String(v) && (now - parseInt(part[1], 10)) < 30000) { return; } }
      if (screen !== 'home') { return; }
      try { global.sessionStorage.setItem(UPD_KEY, v + ':' + now); } catch (e4) { /* 無くても進む */ }
      global.location.replace('./?v=' + v);
    };
    try { x.send(null); } catch (e5) { /* 通信できなくても あそべる */ }
  }
  var cacheReady = false;
  function reloadIfIdle() {
    if (!cacheReady || screen !== 'home') { return; }
    cacheReady = false; global.location.reload();
  }
  function watchCache() {
    var ac = global.applicationCache;
    if (!ac || !ac.addEventListener) { return; }
    ac.addEventListener('updateready', function () {
      try { ac.swapCache(); } catch (e) { /* つぎに ひらいたときに 入れかわる */ }
      cacheReady = true; reloadIfIdle();
    }, false);
  }

  /* ================= 押したときの 受けとり ================= */
  function init() {
    var i;
    on('lv-1', function () { startRound(1); });
    on('lv-2', function () { startRound(2); });
    on('lv-3', function () { startRound(3); });
    on('zukan-btn', function () { renderZukan(); show('zukan'); });
    on('zukan-back', function () { renderHome(); show('home'); });
    on('play-back', function () { stopAnim(); renderHome(); show('home'); });
    on('next-btn', onNext);
    on('hint-btn', onHint);
    on('res-again', function () { startRound(G.level); });
    on('res-up', function () { startRound(Math.min(3, G.level + 1)); });
    on('res-home', function () { renderHome(); show('home'); });
    el('choices').addEventListener('click', function (ev) {
      var t = ev.target, n = 0;
      while (t && n < 5) {
        if (t.getAttribute && t.getAttribute('data-i') !== null) { onChoice(parseInt(t.getAttribute('data-i'), 10)); return; }
        t = t.parentNode; n++;
      }
    }, false);
    /* おとなのひと＝ながおし */
    var gb = el('grown-btn');
    gb.addEventListener('touchstart', function (ev) { ev.preventDefault(); holdStart(); }, false);
    gb.addEventListener('touchend', holdEnd, false);
    gb.addEventListener('touchcancel', holdEnd, false);
    gb.addEventListener('mousedown', holdStart, false);
    gb.addEventListener('mouseup', holdEnd, false);
    gb.addEventListener('mouseleave', holdEnd, false);
    on('grown-back', function () { renderHome(); show('home'); });
    on('grown-save', function () {
      S.name = String(el('grown-name').value || '').slice(0, 8);
      S.perRound = parseInt(el('grown-per').value, 10) === 10 ? 10 : 5;
      KZ.saveState(S); renderHome(); show('home');
    });
    on('reset-1', function () { el('reset-2').style.display = 'inline-block'; });
    on('reset-2', function () {
      var keep = { name: S.name, perRound: S.perRound };
      S = KZ.freshState(); S.name = keep.name; S.perRound = keep.perRound;
      KZ.saveState(S); renderGrown(); setText(el('grown-ver'), 'きろくを けしました');
    });
    global.addEventListener('resize', function () {
      if (screen === 'play' && G) { paintChoices(); KZ.paintCanvas(el('q-before'), G.qs[G.idx].type === 'count' ? G.qs[G.idx].before : { base: G.qs[G.idx].base, mirror: 0, rot: 0 }, 0); if (G.qs[G.idx].type === 'count') { KZ.paintCanvas(el('q-after'), G.qs[G.idx].after, 0); } }
      if (screen === 'home') { renderHome(); }
    }, false);
    tidyUrl();
    watchCache();
    renderHome();
    show('home');
    for (i = 0; i < 1; i++) { /* 何もしない（lint 用の空ループを避けるための形） */ }
  }

  if (doc.readyState === 'loading') { doc.addEventListener('DOMContentLoaded', init, false); } else { init(); }
})(window);
</script>
